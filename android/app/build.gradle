apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Firebase/FCM is not used — push notifications go through our own backend
// instead. Not applying this plugin means no google-services.json is needed.
// apply plugin: "com.google.gms.google-services"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.swiftloan"
    defaultConfig {
        applicationId "com.swiftloan.ai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "0.1.10"
        // WS3: build two coexisting installs from one codebase. Pass
        //   -PappIdSuffix=.ctx -PappLabel="SwiftLoan Continue"
        // for the context build; defaults give the standard app.
        if (project.hasProperty("appIdSuffix")) { applicationIdSuffix project.getProperty("appIdSuffix") }
        resValue "string", "app_name", (project.findProperty("appLabel") ?: "SwiftLoan")
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release/upload signing for Play Store. Credentials are passed in via
        // -P properties (or gradle.properties) so no secret lives in the repo:
        //   -PUPLOAD_STORE_FILE=/abs/path.keystore -PUPLOAD_STORE_PASSWORD=...
        //   -PUPLOAD_KEY_ALIAS=... -PUPLOAD_KEY_PASSWORD=...
        release {
            if (project.hasProperty("UPLOAD_STORE_FILE")) {
                storeFile file(project.property("UPLOAD_STORE_FILE"))
                storePassword project.property("UPLOAD_STORE_PASSWORD")
                keyAlias project.property("UPLOAD_KEY_ALIAS")
                keyPassword project.property("UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Use the release/upload key when its credentials are supplied,
            // otherwise fall back to the debug key (local dev builds).
            signingConfig project.hasProperty("UPLOAD_STORE_FILE") ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // ML Kit on-device Latin text recognition — powers the "Upload PAN photo"
    // OCR (PanOcrModule). Bundled model, no network / Play Services download.
    implementation("com.google.mlkit:text-recognition:16.0.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Upshot SDK, on the app module's own compile classpath.
    //
    // react-native-upshotsdk declares this as `implementation`, not `api`, so its
    // classes are NOT exposed transitively. MainApplication extends
    // UpshotApplication, whose supertype is BKAppStatusListener, so :app must be
    // able to see BrandKinesis at compile time or Kotlin fails with
    // "Cannot access 'BKAppStatusListener' which is a supertype".
    // Version must stay in step with node_modules/react-native-upshotsdk/android/build.gradle.
    implementation 'com.github.Upshot-AI:upshot-android-sdk:v1.8.4x'

    // Upshot's required runtime libraries, per
    // https://www.upshot.ai/documentation/sdk/android/guide/installation
    //
    // The Upshot AAR does NOT bring these transitively. Without work-runtime the
    // app crashes on launch with NoClassDefFoundError: androidx.work.WorkManager,
    // thrown from BrandKinesis.createWorkScheduler() inside Application.onCreate()
    // — i.e. before any JS runs, so it is a hard startup crash, not a degraded
    // feature. The UI libraries below are needed by the activity/IAM/mini-game
    // screens and would fail the same way, only later and only when one is shown.
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Firebase Cloud Messaging — the transport Upshot push rides on.
    // Declared explicitly (not relied on transitively through the RN module) so
    // SwiftLoanMessagingService compiles against it and the version is ours to
    // control. The BOM keeps messaging/analytics on matching versions.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
}
