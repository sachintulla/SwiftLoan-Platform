buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Firebase Cloud Messaging is the transport Upshot push rides on.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        // Upshot ships through JitPack (com.github.Upshot-AI), not Maven Central.
        // react-native-upshotsdk declares the artifact but only registers jitpack
        // inside its own buildscript block, so :app cannot resolve it without this.
        maven { url 'https://jitpack.io' }
    }
}
