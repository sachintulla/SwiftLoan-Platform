name: Auto-retry Deploy on wrong runner

# Deploy Dev's and Deploy Prod's `runs-on: self-hosted` match BOTH self-hosted
# runners (dev box ip-10-10-1-233, prod box ip-10-20-1-186) — they share the
# generic `self-hosted` label because no one with repo-admin/runner
# permissions has added a distinguishing label yet (see the TODOs in
# deploy.yml / deploy-prod.yml). Until that happens, roughly half of all
# deploy runs land on the wrong box and fail loudly at the "Ensure this
# landed on the ... box" guard.
#
# This workflow runs on a GitHub-hosted runner (ubuntu-latest), so it isn't
# subject to that same coin-flip. It watches every Deploy Dev / Deploy Prod
# completion and, if the failure was specifically the wrong-runner guard (not
# a real build/deploy error), automatically re-runs it. Retries are capped so
# a genuinely broken deploy still surfaces instead of looping forever.
#
# This is a workaround, not the real fix. The real fix is adding a `dev`
# label to ip-10-10-1-233 and a `prod` label to ip-10-20-1-186 (Settings >
# Actions > Runners on GitHub), then changing both workflows' `runs-on` to
# target the label directly (e.g. `[self-hosted, prod]`) so a job can never
# land on the wrong box in the first place. That needs repo-admin permission
# (confirmed as of this commit: write-level collaborators, including the one
# who wrote this workaround, do not have it).
on:
  workflow_run:
    workflows: ["Deploy Dev", "Deploy Prod"]
    types: [completed]

permissions:
  actions: write

env:
  MAX_ATTEMPTS: 8

jobs:
  retry-on-wrong-runner:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect failure and re-run if it was the runner coin-flip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -e
          attempt=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.run_attempt')
          echo "Run $RUN_ID ($WORKFLOW_NAME) just finished (attempt $attempt) with conclusion failure."

          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
            echo "::error::$WORKFLOW_NAME run $RUN_ID has failed $attempt times in a row — stopping auto-retry. This may no longer be the runner coin-flip; check the logs manually."
            exit 0
          fi

          # Each workflow's guard names the box IT expects; a wrong-runner
          # failure always names the OTHER box's hostname as "not <expected>".
          case "$WORKFLOW_NAME" in
            "Deploy Dev")  expect="not ip-10-10-1-233" ;;
            "Deploy Prod") expect="not ip-10-20-1-186" ;;
            *)
              echo "::error::Unrecognized workflow '$WORKFLOW_NAME' — not retrying."
              exit 0
              ;;
          esac

          if gh run view "$RUN_ID" --repo "$REPO" --log-failed | grep -q "$expect"; then
            echo "Confirmed: failure was the known wrong-runner guard. Re-running..."
            gh run rerun "$RUN_ID" --repo "$REPO"
          else
            echo "Failure was NOT the wrong-runner guard (looks like a real build/deploy error) — leaving it failed for manual investigation."
          fi
