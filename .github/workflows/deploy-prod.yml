name: Deploy Prod
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # Two self-hosted runners share the generic `self-hosted` label, so GitHub
      # picks whichever is free. Only ip-10-10-1-233 is DNS/nginx-mapped — landing
      # on the other one deploys somewhere no one is looking at. Fail loudly
      # instead: re-run the workflow to get reassigned to the right runner.
      - name: Ensure this landed on the dev box
        run: |
          if [ "$(hostname)" != "ip-10-10-1-233" ]; then
            echo "::error::This job landed on $(hostname), not ip-10-10-1-233. Re-run the workflow so it lands on the correct self-hosted runner."
            exit 1
          fi
      # All config below comes from repo Variables/Secrets (Settings > Secrets and
      # variables > Actions), not a file living only on this box — that file
      # silently drifted out of sync before and is no longer the source of truth.
      - name: Build & deploy server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: |
          cd server
          docker build --no-cache -t swiftloan-api .
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            swiftloan-api npx prisma migrate deploy
          docker stop swiftloan-api || true
          docker rm swiftloan-api || true
          docker run -d --name swiftloan-api --restart unless-stopped \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" \
            -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            -e PORT="${{ vars.SERVER_PORT }}" \
            -e ACCESS_TTL="${{ vars.SERVER_ACCESS_TTL }}" \
            -e REFRESH_TTL_DAYS="${{ vars.SERVER_REFRESH_TTL_DAYS }}" \
            -e NODE_ENV="${{ vars.SERVER_NODE_ENV }}" \
            -e DEMO_LOGIN="${{ vars.SERVER_DEMO_LOGIN }}" \
            -p 4000:4000 swiftloan-api
      - name: Build & deploy admin
        run: |
          cd admin
          docker build --no-cache \
            --build-arg NEXT_PUBLIC_API_BASE="${{ vars.ADMIN_API_BASE }}" \
            --build-arg NEXT_PUBLIC_ELLO_API_KEY="${{ secrets.ADMIN_ELLO_API_KEY }}" \
            --build-arg NEXT_PUBLIC_ELLO_ASSISTANT_ID="${{ vars.ADMIN_ELLO_ASSISTANT_ID }}" \
            --build-arg NEXT_PUBLIC_ELLO_API_BASE="${{ vars.ADMIN_ELLO_API_BASE }}" \
            --build-arg NEXT_PUBLIC_ELLO_WS_URL="${{ vars.ADMIN_ELLO_WS_URL }}" \
            -t swiftloan-admin .
          docker stop swiftloan-admin || true
          docker rm swiftloan-admin || true
          docker run -d --name swiftloan-admin --restart unless-stopped -p 4001:4001 swiftloan-admin
      - name: Build & deploy website
        run: |
          cd website-next
          docker build --no-cache \
            --build-arg NEXT_PUBLIC_API_BASE="${{ vars.WEBSITE_API_BASE }}" \
            --build-arg NEXT_PUBLIC_ELLO_API_KEY="${{ secrets.WEBSITE_ELLO_API_KEY }}" \
            --build-arg NEXT_PUBLIC_ELLO_ASSISTANT_ID="${{ vars.WEBSITE_ELLO_ASSISTANT_ID }}" \
            --build-arg NEXT_PUBLIC_ELLO_API_BASE="${{ vars.WEBSITE_ELLO_API_BASE }}" \
            --build-arg NEXT_PUBLIC_ELLO_WS_URL="${{ vars.WEBSITE_ELLO_WS_URL }}" \
            -t swiftloan-website .
          docker stop swiftloan-website || true
          docker rm swiftloan-website || true
          docker run -d --name swiftloan-website --restart unless-stopped -p 4002:4002 swiftloan-website
