name: Deploy Prod
on:
  push:
    branches: [main]
jobs:
  deploy:
    # TODO: pin this to a runner-specific label (e.g. a custom label
    # `ip-10-20-1-186` added to that runner in Settings > Actions > Runners)
    # instead of the shared `self-hosted` label both boxes carry, once someone
    # with repo admin/runner permissions adds it — that removes the coin-flip
    # below entirely. Reverted to `self-hosted` for now because `runs-on`
    # can't target a runner by its bare registered name, only by label, and
    # no such label exists yet.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # Two self-hosted runners share the generic `self-hosted` label, so
      # GitHub picks whichever is free. Only ip-10-20-1-186 is this workflow's
      # target — landing on the other one deploys somewhere no one is looking
      # at. Fail loudly instead: re-run the workflow to get reassigned to the
      # right runner.
      - name: Ensure this landed on the prod box
        run: |
          if [ "$(hostname)" != "ip-10-20-1-186" ]; then
            echo "::error::This job landed on $(hostname), not ip-10-20-1-186 (prod). Re-run the workflow so it lands on the correct self-hosted runner."
            exit 1
          fi
      # All config comes from ~/secrets/server.env on THIS (prod) box — its
      # own file, separate from dev's ~/secrets/server.env on ip-10-10-1-233.
      # Deliberately not GitHub Secrets/Variables (that approach drifted out
      # of sync before); update it here via SSH, don't let GitHub
      # Secrets/Variables silently diverge from it.
      - name: Build & deploy server
        run: |
          set -a
          source ~/secrets/server.env
          set +a
          cd server
          docker build --no-cache -t swiftloan-api .
          docker run --rm --env-file ~/secrets/server.env \
            swiftloan-api npx prisma migrate deploy
          # Bootstraps IntegrationConfig (Ello telephonic calling) from these env
          # vars — merges, never clears a secret left blank. The admin dashboard's
          # /integrations page remains the real place to manage these afterward.
          docker run --rm --env-file ~/secrets/server.env \
            swiftloan-api npx tsx prisma/seed.integrations.ts
          docker stop swiftloan-api || true
          docker rm swiftloan-api || true
          docker run -d --name swiftloan-api --restart unless-stopped \
            --env-file ~/secrets/server.env \
            -p 4000:4000 swiftloan-api
      - name: Build & deploy admin
        run: |
          set -a
          source ~/secrets/server.env
          set +a
          cd admin
          docker build --no-cache \
            --build-arg NEXT_PUBLIC_API_BASE="$ADMIN_NEXT_PUBLIC_API_BASE" \
            --build-arg NEXT_PUBLIC_ELLO_API_KEY="$ADMIN_NEXT_PUBLIC_ELLO_API_KEY" \
            --build-arg NEXT_PUBLIC_ELLO_ASSISTANT_ID="$ADMIN_NEXT_PUBLIC_ELLO_ASSISTANT_ID" \
            --build-arg NEXT_PUBLIC_ELLO_API_BASE="$ADMIN_NEXT_PUBLIC_ELLO_API_BASE" \
            --build-arg NEXT_PUBLIC_ELLO_WS_URL="$ADMIN_NEXT_PUBLIC_ELLO_WS_URL" \
            -t swiftloan-admin .
          docker stop swiftloan-admin || true
          docker rm swiftloan-admin || true
          docker run -d --name swiftloan-admin --restart unless-stopped -p 4001:4001 swiftloan-admin
      - name: Build & deploy website
        run: |
          set -a
          source ~/secrets/server.env
          set +a
          cd website-next
          docker build --no-cache \
            --build-arg NEXT_PUBLIC_API_BASE="$WEBSITE_NEXT_PUBLIC_API_BASE" \
            --build-arg NEXT_PUBLIC_ELLO_API_KEY="$WEBSITE_NEXT_PUBLIC_ELLO_API_KEY" \
            --build-arg NEXT_PUBLIC_ELLO_ASSISTANT_ID="$WEBSITE_NEXT_PUBLIC_ELLO_ASSISTANT_ID" \
            --build-arg NEXT_PUBLIC_ELLO_API_BASE="$WEBSITE_NEXT_PUBLIC_ELLO_API_BASE" \
            --build-arg NEXT_PUBLIC_ELLO_WS_URL="$WEBSITE_NEXT_PUBLIC_ELLO_WS_URL" \
            -t swiftloan-website .
          docker stop swiftloan-website || true
          docker rm swiftloan-website || true
          docker run -d --name swiftloan-website --restart unless-stopped -p 4002:4002 swiftloan-website

      # Prune superseded (dangling) images + build cache after each deploy so the
      # --no-cache rebuilds (~3.6 GB each) don't fill the disk. Runs even on
      # failure; never touches the running tagged images.
      - name: Reclaim disk (prune superseded images + build cache)
        if: always()
        run: |
          docker image prune -f || true
          docker builder prune -af || true
          df -h / | tail -1 || true
