<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1050" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#16a34a"/>
    </marker>
    <style>
      .tier{fill:#f0fdf4;stroke:#bbf7d0;stroke-width:1.5}
      .tierlbl{fill:#15803d;font-size:13px;font-weight:700;letter-spacing:1px}
      .box{fill:#ffffff;stroke:#86efac;stroke-width:1.5}
      .boxh{fill:#166534;font-size:15px;font-weight:700}
      .t{fill:#334155;font-size:12.5px}
      .tm{fill:#64748b;font-size:11.5px}
      .ok{fill:#15803d;font-size:12px;font-weight:700}
      .ctl{fill:#ecfdf5;stroke:#16a34a;stroke-width:1.4}
      .vault{fill:#eff6ff;stroke:#2563eb;stroke-width:1.8}
      .gate{fill:#fefce8;stroke:#ca8a04;stroke-width:1.6}
      .ext{fill:#fff7ed;stroke:#fb923c;stroke-width:1.8}
      .flow{stroke:#0f766e;stroke-width:1.6;fill:none}
      .flowg{stroke:#16a34a;stroke-width:2;fill:none}
      .flbl{fill:#0f766e;font-size:11px}
      .flblg{fill:#15803d;font-size:11px;font-weight:700}
      .title{fill:#0f172a;font-size:26px;font-weight:800}
      .sub{fill:#64748b;font-size:14px}
      .comp{fill:#1e3a8a;font-size:11.5px;font-weight:600}
      .cbadge{fill:#dbeafe;stroke:#3b82f6;stroke-width:1}
      .chk{fill:#16a34a;font-size:13px;font-weight:800}
    </style>
  </defs>

  <rect width="1480" height="1050" fill="#ffffff"/>
  <text x="40" y="46" class="title">SwiftLoan — Recommended Target Architecture</text>
  <text x="40" y="70" class="sub">Same flow, hardened. Green = new/changed control. Blue tags = the compliance obligation each control satisfies. ✓ = already present, keep.</text>

  <!-- data residency boundary -->
  <rect x="28" y="88" width="1180" height="872" rx="16" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="44" y="108" class="comp" font-size="13px">🇮🇳 India data-residency boundary — all customer PII processed &amp; stored in India (RBI Digital Lending Guidelines · CERT-In)</text>

  <!-- ============ CLIENT TIER ============ -->
  <rect x="42" y="120" width="378" height="822" rx="12" class="tier"/>
  <text x="60" y="145" class="tierlbl">CLIENT / EDGE</text>

  <rect x="60" y="158" width="342" height="150" rx="9" class="box"/>
  <text x="74" y="182" class="boxh">📱 Mobile App (hardened)</text>
  <rect x="74" y="196" width="314" height="100" rx="7" class="ctl"/>
  <text x="88" y="216" class="ok">Secure input for PAN/Aadhaar</text>
  <text x="88" y="233" class="tm">secureTextEntry · autofill off · client-side mask</text>
  <text x="88" y="251" class="ok">Remove DEMO-OTP 123456 bypass</text>
  <text x="88" y="269" class="ok">No secrets in bundle → server-brokered</text>
  <text x="88" y="287" class="tm">ephemeral voice token (short-lived)</text>

  <rect x="60" y="318" width="342" height="182" rx="9" class="gate"/>
  <text x="74" y="342" class="boxh">🎙 Voice copilot "Ruby" — consented &amp; redacted</text>
  <text x="74" y="364" class="ok">① Explicit opt-in consent before mic starts</text>
  <text x="74" y="384" class="ok">② Redact sensitive VALUES from page_context</text>
  <text x="74" y="402" class="tm">never send PAN/Aadhaar/income/OTP to Ello</text>
  <text x="74" y="422" class="ok">③ wss:// + https only (no cleartext ws/http)</text>
  <text x="74" y="442" class="ok">④ On-device redaction of read_screen values</text>
  <text x="74" y="462" class="tm">audio min. + do-not-record for sensitive steps</text>
  <text x="74" y="484" class="comp">DPDP §6 consent · RBI DLG data-minimisation</text>

  <rect x="60" y="510" width="342" height="120" rx="9" class="box"/>
  <text x="74" y="534" class="boxh">🖥 Admin Dashboard</text>
  <text x="74" y="556" class="ok">Remove default creds · force reset + MFA</text>
  <text x="74" y="575" class="ok">RBAC — PII visible only to authorised roles</text>
  <text x="74" y="594" class="ok">Tokens in httpOnly cookies (not localStorage)</text>
  <text x="74" y="613" class="ok">PAN masked in UI (••••••1234) · access-logged</text>

  <rect x="60" y="640" width="342" height="96" rx="9" class="box"/>
  <text x="74" y="664" class="boxh">🌐 Marketing site</text>
  <text x="74" y="686" class="ok">Granular consent + purpose notice on lead form</text>
  <text x="74" y="705" class="ok">Voice key via env only (no key in static JS)</text>
  <text x="74" y="724" class="tm">first-party lead capture → API (unchanged)</text>

  <rect x="60" y="746" width="342" height="182" rx="9" class="cbadge"/>
  <text x="74" y="770" class="comp" font-size="13px">Data-principal rights surface (in-app)</text>
  <text x="74" y="792" class="t">• Access / download my data (portability)</text>
  <text x="74" y="812" class="t">• Correct my data</text>
  <text x="74" y="832" class="t">• Delete my account &amp; data (erasure) ✓ extend</text>
  <text x="74" y="852" class="t">• Withdraw consent (per purpose)</text>
  <text x="74" y="872" class="t">• Consent history &amp; grievance contact</text>
  <text x="74" y="894" class="comp">DPDP §11–14 Data-Principal rights</text>
  <text x="74" y="914" class="comp">RBI DLG grievance-redressal / nodal officer</text>

  <!-- ============ API TIER ============ -->
  <rect x="440" y="120" width="410" height="822" rx="12" class="tier"/>
  <text x="458" y="145" class="tierlbl">APPLICATION / API</text>

  <rect x="458" y="158" width="374" height="150" rx="9" class="ctl"/>
  <text x="472" y="182" class="boxh">🛡 API Gateway / edge</text>
  <text x="472" y="204" class="ok">TLS 1.2+ · HSTS · cert pinning</text>
  <text x="472" y="223" class="ok">Strict CORS allow-list (not cors() open)</text>
  <text x="472" y="242" class="ok">Rate-limit / WAF on ALL routes</text>
  <text x="472" y="261" class="ok">AuthN + AuthZ on every PII route</text>
  <text x="472" y="283" class="comp">CERT-In · RBI IT-governance · ISO 27001</text>

  <rect x="458" y="318" width="374" height="168" rx="9" class="box"/>
  <text x="472" y="342" class="boxh">⚙ Express API (fail-closed)</text>
  <text x="472" y="364" class="ok">No dev-secret fallback — boot fails if unset</text>
  <text x="472" y="383" class="ok">Secrets in KMS/secrets-manager, rotated</text>
  <text x="472" y="402" class="ok">DEMO_LOGIN off in prod</text>
  <text x="472" y="421" class="t">JWT access + rotating refresh (hashed) ✓</text>
  <text x="472" y="440" class="t">OTP codeHash ✓ · passwordHash bcrypt ✓</text>
  <text x="472" y="462" class="comp">DPDP §8 reasonable security safeguards</text>

  <rect x="458" y="496" width="374" height="128" rx="9" class="ctl"/>
  <text x="472" y="520" class="boxh">🔎 PII redaction + consent middleware</text>
  <text x="472" y="542" class="ok">Allow-list tracking metadata — scrub PII</text>
  <text x="472" y="561" class="ok">Consent check before partner / CIBIL share</text>
  <text x="472" y="580" class="ok">AuditLog WRITE on every PII read/export ✓wire</text>
  <text x="472" y="599" class="tm">structured logs w/ PII masking (no raw bodies)</text>
  <text x="472" y="617" class="comp">DPDP purpose-limitation · RBI DLG consent</text>

  <rect x="458" y="634" width="374" height="128" rx="9" class="ctl"/>
  <text x="472" y="658" class="boxh">🗓 Retention &amp; erasure service</text>
  <text x="472" y="680" class="ok">TTL + scheduled purge (leads, context, events)</text>
  <text x="472" y="699" class="ok">DSAR API: access · correct · erase · export</text>
  <text x="472" y="718" class="ok">Erasure covers orphan PII + Notification.body</text>
  <text x="472" y="737" class="tm">breach-notification runbook (72h / CERT-In 6h)</text>
  <text x="472" y="755" class="comp">DPDP §8(7) retention · §11 erasure</text>

  <rect x="458" y="772" width="374" height="156" rx="9" class="cbadge"/>
  <text x="472" y="796" class="comp" font-size="13px">Governance to stand up</text>
  <text x="472" y="818" class="t">• Named Data Protection Officer / grievance officer</text>
  <text x="472" y="838" class="t">• RoPA (record of processing) + data-flow map</text>
  <text x="472" y="858" class="t">• DPIA for voice AI + PAN processing</text>
  <text x="472" y="878" class="t">• DPAs with Ello + lending partners + Render/DB host</text>
  <text x="472" y="898" class="t">• Consent-artifact storage (immutable, timestamped)</text>
  <text x="472" y="918" class="comp">DPDP Data-Fiduciary duties · RBI DLG governance</text>

  <!-- ============ DATA TIER ============ -->
  <rect x="870" y="120" width="338" height="822" rx="12" class="tier"/>
  <text x="888" y="145" class="tierlbl">DATA AT REST</text>

  <rect x="888" y="158" width="302" height="210" rx="9" class="vault"/>
  <text x="902" y="182" class="boxh">🔐 PAN token vault</text>
  <text x="902" y="204" class="t">Full PAN → tokenize / field-encrypt</text>
  <text x="902" y="223" class="t">DB stores token or ciphertext, not PAN</text>
  <text x="902" y="242" class="ok">De-duplicate: one source of truth</text>
  <text x="902" y="261" class="tm">LoanApplication references token, not copy</text>
  <text x="902" y="283" class="ok">Aadhaar last-4 only ✓ (keep)</text>
  <text x="902" y="302" class="ok">Bank acct last-4 only ✓ (keep)</text>
  <text x="902" y="324" class="comp">RBI KYC/CKYC · masked-PAN norms</text>
  <text x="902" y="344" class="comp">DPDP §8 safeguards · PCI-style controls</text>

  <rect x="888" y="378" width="302" height="150" rx="9" class="ctl"/>
  <text x="902" y="402" class="boxh">🗄 PostgreSQL</text>
  <text x="902" y="424" class="ok">Encryption at rest (TDE / disk)</text>
  <text x="902" y="443" class="ok">Encrypted, access-controlled backups</text>
  <text x="902" y="462" class="ok">Least-privilege DB roles</text>
  <text x="902" y="481" class="ok">Hosted in India region</text>
  <text x="902" y="503" class="comp">RBI DLG data-localisation · DPDP §8</text>

  <rect x="888" y="538" width="302" height="120" rx="9" class="box"/>
  <text x="902" y="562" class="boxh">🔑 KMS / Secrets Manager</text>
  <text x="902" y="584" class="ok">Encryption keys · JWT · DB creds · API keys</text>
  <text x="902" y="603" class="ok">Rotation policy + audit</text>
  <text x="902" y="622" class="ok">No secret in git — rotate committed Ello key</text>
  <text x="902" y="644" class="comp">CERT-In key-management · ISO 27001 A.10</text>

  <rect x="888" y="668" width="302" height="260" rx="9" class="cbadge"/>
  <text x="902" y="692" class="comp" font-size="13px">Compliance regime — India</text>
  <text x="902" y="716" class="t">DPDP Act 2023 — consent, purpose limit,</text>
  <text x="902" y="734" class="t">data-principal rights, security, breach notice</text>
  <text x="902" y="758" class="t">RBI Digital Lending Guidelines 2022 —</text>
  <text x="902" y="776" class="t">data-minimisation, localisation, DLA/LSP</text>
  <text x="902" y="794" class="t">disclosure, no biometric storage, grievance</text>
  <text x="902" y="818" class="t">RBI Master KYC Direction — CKYC, PAN/Aadhaar</text>
  <text x="902" y="836" class="t">CERT-In 2022 — 6-hr breach report, logs 180d</text>
  <text x="902" y="860" class="t">IT Act §43A / SPDI Rules — sensitive data</text>
  <text x="902" y="884" class="t">Frameworks: ISO 27001 / SOC 2 (assurance)</text>
  <text x="902" y="910" class="comp">Map each control → obligation in the plan.</text>

  <!-- ============ EXTERNAL TIER ============ -->
  <rect x="1224" y="120" width="228" height="822" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="1240" y="145" class="tierlbl" fill="#c2410c">EXTERNAL PROCESSORS</text>

  <rect x="1240" y="158" width="196" height="270" rx="9" class="ext"/>
  <text x="1252" y="182" class="boxh" fill="#c2410c">🔊 Ello Voice AI</text>
  <text x="1252" y="204" class="t">Bind as Data Processor:</text>
  <text x="1252" y="224" class="ok">Signed DPA + SCCs</text>
  <text x="1252" y="243" class="ok">India region / residency</text>
  <text x="1252" y="262" class="ok">Send minimum only —</text>
  <text x="1252" y="280" class="tm">no PAN/Aadhaar/OTP</text>
  <text x="1252" y="299" class="ok">Consent gate before</text>
  <text x="1252" y="317" class="tm">any audio leaves device</text>
  <text x="1252" y="336" class="ok">Retention + delete SLA</text>
  <text x="1252" y="355" class="ok">Rotate committed key</text>
  <text x="1252" y="377" class="comp" font-size="10.5px">DPDP §8 processor</text>
  <text x="1252" y="394" class="comp" font-size="10.5px">obligations · DLG</text>
  <text x="1252" y="411" class="comp" font-size="10.5px">3rd-party rules</text>

  <rect x="1240" y="440" width="196" height="230" rx="9" class="ext"/>
  <text x="1252" y="464" class="boxh" fill="#c2410c">🏦 Lending partners</text>
  <text x="1252" y="486" class="t">RBI-regulated REs</text>
  <text x="1252" y="507" class="ok">Share only on explicit</text>
  <text x="1252" y="525" class="tm">data_sharing + soft_pull</text>
  <text x="1252" y="543" class="tm">consent (per purpose)</text>
  <text x="1252" y="562" class="ok">DPA / data-share pact</text>
  <text x="1252" y="581" class="ok">Log every disclosure</text>
  <text x="1252" y="600" class="ok">Key Fact Statement +</text>
  <text x="1252" y="618" class="tm">LSP/DLA disclosure</text>
  <text x="1252" y="640" class="comp" font-size="10.5px">RBI DLG · CICRA</text>
  <text x="1252" y="657" class="comp" font-size="10.5px">(CIBIL) consent</text>

  <rect x="1240" y="682" width="196" height="246" rx="9" class="cbadge"/>
  <text x="1252" y="706" class="comp" font-size="12.5px">Priority order</text>
  <text x="1252" y="729" class="chk">P0 now</text>
  <text x="1252" y="748" class="tm" font-size="10.5px">rotate key · kill demo</text>
  <text x="1252" y="763" class="tm" font-size="10.5px">OTP · default creds ·</text>
  <text x="1252" y="778" class="tm" font-size="10.5px">redact PAN→Ello</text>
  <text x="1268" y="800" class="chk">P1</text>
  <text x="1252" y="818" class="tm" font-size="10.5px">encrypt/tokenize PAN</text>
  <text x="1252" y="833" class="tm" font-size="10.5px">consent wiring · DPAs</text>
  <text x="1268" y="855" class="chk">P2</text>
  <text x="1252" y="873" class="tm" font-size="10.5px">retention/erasure ·</text>
  <text x="1252" y="888" class="tm" font-size="10.5px">audit · DPO · DPIA</text>
  <text x="1268" y="910" class="chk">P3</text>
  <text x="1252" y="924" class="tm" font-size="10.5px">ISO/SOC2 assurance</text>

  <!-- flows -->
  <path class="flowg" d="M402 400 C 420 400, 424 402, 440 402" marker-end="url(#arrowG)"/>
  <path class="flow" d="M832 236 C 850 236, 855 380, 870 420" marker-end="url(#arrow)"/>
  <text x="836" y="330" class="flbl">encrypted</text>
  <path class="flow" d="M402 400 C 1180 470, 1150 300, 1240 290" marker-end="url(#arrow)" opacity="0.35"/>
  <path class="flowg" d="M832 300 C 1120 300, 1150 290, 1240 285" marker-end="url(#arrowG)"/>
  <text x="980" y="278" class="flblg">min. data + DPA</text>
  <path class="flowg" d="M832 560 C 1120 560, 1150 550, 1240 552" marker-end="url(#arrowG)"/>
  <text x="980" y="546" class="flblg">consent-gated share</text>
</svg>
