# Render Blueprint — deploys the SwiftLoan API (server/) and admin dashboard (admin/).
# One-time setup: Render dashboard → New → Blueprint → connect this repo.
# Then set the two `sync: false` secrets (DATABASE_URL, NEXT_PUBLIC_API_BASE) in the UI.
services:
  # ── API (Express + Prisma) ──────────────────────────────────────────────
  - type: web
    name: swiftloan-api
    runtime: node
    plan: free
    rootDir: server
    # `migrate deploy` is NOT optional: without it the cloud database keeps the
    # schema from whenever it was last hand-migrated, so anything added since
    # (Conversation, ConversationSummary, the CallAttempt provenance columns)
    # simply does not exist and every endpoint touching them 500s. It only ever
    # applies committed migrations — it never generates or drops anything — so it
    # is safe to run on every deploy.
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL          # paste your Neon URL here in the Render UI
        sync: false
      - key: NODE_ENV
        value: production

      # ── Ello: outbound calling + the conversation memory API ──────────────
      # Server-side only. Set both in the Render UI; never commit them.
      - key: ELLO_API_KEY
        sync: false
      # The shared secret Ello sends back as x-api-key / x-webhook-secret on both
      # the webhooks and the conversation API. Generated rather than reused from
      # local, because the dev value is a known string.
      - key: ELLO_WEBHOOK_SECRET
        generateValue: true

      # ── Outbound calling window (IST minutes from midnight) ───────────────
      # 09:00–21:00. India's telemarketing rules restrict when a lender may call,
      # and these are the guard that enforces it — do not widen them in
      # production, whatever a local .env may say during testing.
      - key: LEAD_CALL_WINDOW_START
        value: "540"
      - key: LEAD_CALL_WINDOW_END
        value: "1260"
      - key: LEAD_CALL_TIMEZONE
        value: Asia/Kolkata
      - key: LEAD_CALL_DELAY_MINUTES
        value: "1"
      # Spend ceiling. /api/context/create is public, so without a cap a scripted
      # form-spam run turns straight into a telephony bill.
      - key: LEAD_CALL_MAX_PER_HOUR
        value: "60"
      # Demo/mock loan app: accept a fixed OTP (123456) and surface it to the client
      # so testers can log in without real SMS. Remove for a real production launch.
      # NOTE: this and the real SMS below are mutually exclusive in practice — while
      # DEMO_LOGIN is on, testers can log in with 123456 regardless of what the
      # gateway delivered. Turn it off the moment real OTP delivery is trusted.
      - key: DEMO_LOGIN
        value: "true"

      # ── Mobile login OTP over SMS (Vox Digitals CPaaS, India/DLT) ─────────
      # The credential is a PAIR and both halves are secrets — set them in the
      # Render UI, never here. A missing projectid returns the SAME 1401 as a bad
      # token, so a partial credential fails every OTP indistinguishably.
      - key: SMS_PROVIDER
        value: vox
      - key: VOX_AUTH_TOKEN
        sync: false
      - key: VOX_PROJECT_ID
        sync: false
      # v2 is JSON-only and 415s on form-urlencoded (v1 is the exact inverse).
      # src/lib/sms.ts picks the transport from the /v2/ in this path.
      # TODO: the operator gave us a bare-IP HTTP endpoint, which sends the auth
      # token in clear text. Ask them for an HTTPS hostname before real traffic.
      - key: VOX_BASE_URL
        value: http://173.224.118.89:9092/sms-customer-apis/sms/v2/send
      # DLT-registered sender header. Must be exactly the registered 6-char ID —
      # the operator drops an unrecognised header silently while the gateway still
      # answers "200 Success". An invalid `SW_app` here delivered zero of six OTPs.
      - key: VOX_SENDER
        value: GMPE
      - key: VOX_TEMPLATE_ID
        value: "1677100000000389280"
      # Must match the DLT-registered template character-for-character, with only
      # {#var#} substituted. A mismatch is dropped as silently as a bad header.
      - key: VOX_TEMPLATE_TEXT
        value: Dear Customer, your SwiftLoan login OTP is {#var#}. This OTP is valid for 10 minutes. Do not share this OTP with anyone. Team SwiftLoan
      # Delivery receipts. Without this we only ever learn that Vox accepted the
      # message, never that a handset received it. Point it at a real endpoint —
      # the local value is a throwaway webhook.site bin.
      - key: VOX_DLR_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ACCESS_TTL
        value: "900"
      - key: REFRESH_TTL_DAYS
        value: "30"

  # ── Admin dashboard (Next.js) ───────────────────────────────────────────
  - type: web
    name: swiftloan-admin
    runtime: node
    plan: free
    rootDir: admin
    buildCommand: npm install --include=dev && npm run build
    # Next reads $PORT from the environment; Render provides it.
    startCommand: npx next start -p $PORT
    envVars:
      # Set this to the API service's public URL after its first deploy,
      # e.g. https://swiftloan-api.onrender.com  (then redeploy this service).
      - key: NEXT_PUBLIC_API_BASE
        sync: false
      # NO Ello API key or assistant id here any more.
      #
      # NEXT_PUBLIC_* values are compiled into the browser bundle, so setting the
      # key here published it to every visitor — enough to run up call charges or
      # rewrite agent prompts. The dashboard now starts its voice session through
      # our own API (POST /api/voice/session), which holds the key server-side and
      # resolves which agent a role maps to.
      #
      # Only the WebSocket host is still needed client-side; a socket URL is not a
      # credential.
      - key: NEXT_PUBLIC_ELLO_WS_URL
        value: wss://connect-in.getello.ai/ws-ello

  # ── Marketing website (static swiftloan.ai site + Ello voice guide) ──────
  - type: web
    name: swiftloan-website
    runtime: static
    rootDir: website
    buildCommand: "echo static site, no build step"
    staticPublishPath: .
